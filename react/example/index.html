<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tmark React example</title>
    <link rel="stylesheet" href="./dist/app.css" />
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; background: #f6f7fb; color: #1f2328; }
      #root { min-height: 100vh; }
      .app { display: grid; grid-template-columns: 220px minmax(0, 1fr) minmax(0, 1fr); height: 100vh; height: 100dvh; }
      .mobile-header, .menu-backdrop { display: none; }
      .tabs { border-right: 1px solid #d8dce3; background: #fff; padding: 12px; overflow: auto; }
      .tabs button { display: block; width: 100%; border: 0; background: transparent; padding: 10px 12px; text-align: left; border-radius: 6px; cursor: pointer; }
      .tabs button.active { background: #e7eefc; color: #174ea6; font-weight: 650; }
      .content { min-width: 0; padding: 28px; overflow: auto; }
      .document { max-width: 1040px; }
      .source { min-width: 0; overflow: auto; border-left: 1px solid #d8dce3; background: #fff; }
      .source-code { width: max-content; min-width: 100%; box-sizing: border-box; margin: 0; padding: 28px; border-radius: 0; background: transparent; color: #1f2328; font: 13px/1.55 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; tab-size: 2; }
      @media (max-width: 1100px) {
        .app { position: relative; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
        .mobile-header { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #d8dce3; background: #fff; z-index: 3; }
        .mobile-header button { min-height: 40px; border: 1px solid #d8dce3; border-radius: 6px; background: #fff; color: inherit; cursor: pointer; }
        .menu-toggle { display: grid; place-items: center; padding: 0; }
        .menu-icon { display: flex; width: 18px; height: 14px; flex-direction: column; justify-content: space-between; }
        .menu-icon span { width: 100%; height: 2px; border-radius: 1px; background: currentColor; }
        .view-toggle { padding: 0 12px; }
        .mobile-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
        .menu-backdrop { display: block; position: fixed; inset: 0; z-index: 1; width: 100%; border: 0; background: #0005; }
        .tabs { display: none; position: absolute; top: 57px; bottom: 0; left: 0; z-index: 2; width: min(280px, 80vw); box-sizing: border-box; box-shadow: 4px 0 16px #0002; }
        .tabs.tabs-open { display: block; }
        .content, .source { grid-column: 1; grid-row: 2; }
        .content { padding: 16px; }
        .source { border-left: 0; }
        .source-code { padding: 16px; }
        .app[data-view="render"] .source, .app[data-view="source"] .content { display: none; }
      }
      img, video { max-width: 100%; }
      figure { margin: 20px 0; }
      figcaption, cite { color: #59636e; font-size: 0.9rem; margin-top: 6px; }
      blockquote { border-left: 4px solid #c7ccd4; margin-left:   0; padding-left: 14px; }
      aside { border-left: 4px solid #2563eb; padding-left: 14px; }
      pre { background: #111827; color: #f9fafb; padding: 14px; border-radius: 8px; overflow: auto; }
      table { border-collapse: collapse; width: 100%; margin: 12px 0; }
      td, th { padding: 8px 10px; }
      .striped tr:nth-child(even) { background: #e5e7eb; }
      .media-group { display: flex; flex-wrap: wrap; gap: 12px; }
      .media-group figure { width: 240px; margin: 0; }
      .placeholder { border: 1px solid #c7ccd4; border-radius: 8px; padding: 12px; color: #59636e; }
      .spoiler { background: #1f2328; color: #1f2328; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
